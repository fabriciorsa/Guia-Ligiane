<VirtualHost *:80>
    ServerName tototur.com.br
    ServerAlias www.tototur.com.br

    ProxyRequests Off
    ProxyPreserveHost On

    <Proxy *>
        Require all granted
    </Proxy>

    ProxyPass / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    ErrorLog logs/tototur.com.br-error_log
    CustomLog logs/tototur.com.br-access_log common
</VirtualHost>
